function hazeSky(mat) {

    .replace("uniform float mieDirectionalG;", "uniform float mieDirectionalG;\nuniform vec3 uHaze;\nuniform float uScale;")
    .replace("gl_FragColor = vec4( texColor, 1.0 );", `
      texColor = max( texColor * uScale, vec3( 0.004, 0.006, 0.016 ) );
      float hz = smoothstep( -0.02, 0.22, direction.y );
      texColor = mix( uHaze, min( texColor, vec3( 6.0 ) ), hz );
      gl_FragColor = vec4( texColor, 1.0 );`);
  mat.needsUpdate = true;
}

function setNight(on) {
  isNight = !!on; document.getElementById("night").checked = isNight;
  U.uNight.value = isNight ? 1 : 0;
  const az = 215, el = isNight ? -12 : 36;
  const dir = new THREE.Vector3(Math.sin(az * DEG) * Math.cos(el * DEG), Math.sin(el * DEG), -Math.cos(az * DEG) * Math.cos(el * DEG));
  const golden = isNight ? 0 : 1 - THREE.MathUtils.smoothstep(el, 4, 22);
  const fogC = new THREE.Color(isNight ? 0x1b1f2e : 0xd5dde2);
  for (const u of [su, envSky.material.uniforms]) {
    u.sunPosition.value.copy(dir); u.turbidity.value = 10 + 2 * golden; u.rayleigh.value = isNight ? 0.75 : 0.75 + 1.8 * golden;
    u.mieCoefficient.value = 0.012; u.mieDirectionalG.value = 0.86; u.uHaze.value.copy(fogC);
  }
  const e = envSky.material.uniforms; e.uScale.value = 1;
  let L = 0, n = 0; cubeCam.update(renderer, envScene);
  for (const f of [0, 1, 2, 4, 5]) { renderer.readRenderTargetPixels(cubeRT, 0, 0, 8, 8, px, f); for (let i = 0; i < 64; i++) { const v = 0.2126 * px[4 * i] + 0.7152 * px[4 * i + 1] + 0.0722 * px[4 * i + 2]; if (isFinite(v)) { L += v; n++; } } }
  const scale = THREE.MathUtils.clamp(0.35 / Math.max(n ? L / n : 4, 1e-4), 0.08, 0.25);
  e.uScale.value = scale; su.uScale.value = scale;
  if (envRT) envRT.dispose(); envRT = pmrem.fromScene(envScene, 0, 0.1, 2000); scene.environment = envRT.texture;
  scene.fog.color.copy(fogC);
  const ldir = isNight ? new THREE.Vector3(-0.4, 0.75, 0.3).normalize() : dir;
  sun.target.position.set(0, 0, -20); sun.position.copy(sun.target.position).addScaledVector(ldir, 300);

function building(x0, z0, x1, z1, h, type, seed, floorH, hex) {
  const P = [], N = [], UV = [], C = [], F = [], I = [];
  const col = new THREE.Color(hex);
  const ring = [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
  let u = 0;
  for (let i = 0; i < 4; i++) {
    const [ax, az] = ring[i], [bx, bz] = ring[(i + 1) % 4], len = Math.hypot(bx - ax, bz - az);
    const nx = (bz - az) / len, nz = -(bx - ax) / len, v0 = P.length / 3;
    P.push(ax, 0, az, bx, 0, bz, bx, h, bz, ax, h, az);
    for (let k = 0; k < 4; k++) { N.push(nx, 0, nz); C.push(col.r, col.g, col.b); F.push(type, seed, floorH, h); }
    UV.push(u, 0, u + len, 0, u + len, h, u, h);
    I.push(v0, v0 + 2, v0 + 1, v0, v0 + 3, v0 + 2);
    u += len;
  }
  const v0 = P.length / 3, rt = type === 0 ? 9.2 : 9;
  for (const [x, z] of ring) { P.push(x, h, z); N.push(0, 1, 0); UV.push(x, z); C.push(col.r, col.g, col.b); F.push(rt, seed, floorH, h); }
  I.push(v0, v0 + 2, v0 + 1, v0, v0 + 3, v0 + 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(P, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(N, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(UV, 2)); g.setAttribute("color", new THREE.Float32BufferAttribute(C, 3));
  g.setAttribute("facade", new THREE.Float32BufferAttribute(F, 4)); g.setIndex(I);
  const m = new THREE.Mesh(g, bMat); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

  camera.fov = v.fov || 60; camera.updateProjectionMatrix();
  camera.position.set(...v.pos); controls.target.set(...v.tgt); controls.update();
  sel.value = k in VIEWS ? k : "street";
  layer.dirty = true;
}
sel.onchange = () => setView(sel.value);
document.getElementById("night").onchange = e => setNight(e.target.checked);
const atlasBox = document.getElementById("atlasBox");
atlasBox.appendChild(layer.atlas.canvas);
document.getElementById("atlas").onchange = e => { atlasBox.style.display = e.target.checked ? "block" : "none"; };
if (Q.get("atlas") === "1") { document.getElementById("atlas").checked = true; atlasBox.style.display = "block"; }

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- draw calls
// Rendered twice straight to a small target, with and without the sign meshes; the
// difference is what the SignLayer costs (main pass + shadow pass).
const probeRT = new THREE.WebGLRenderTarget(64, 64);
function measureCalls() {
  const signMeshes = Object.values(layer.meshes);
  const run = () => { renderer.setRenderTarget(probeRT); renderer.info.reset(); renderer.render(scene, camera); const c = renderer.info.render.calls; renderer.setRenderTarget(null); return c; };
  const withShadow = run();
  signMeshes.forEach(m => (m.visible = false)); const without = run(); signMeshes.forEach(m => (m.visible = true));
  sun.castShadow = false; const noShadowWith = run();
  signMeshes.forEach(m => (m.visible = false)); const noShadowWithout = run(); signMeshes.forEach(m => (m.visible = true));
  sun.castShadow = true;
  return { mainPass: noShadowWith - noShadowWithout, withShadowPass: withShadow - without, meshesWithInstances: signMeshes.filter(m => m.count > 0).length };
}
function report() {
  const a = layer.atlas, u = a.usage(frameNo);
  return {
    instances: layer.stats.instances, atlas: { ...u, stats: { ...a.stats } }, bias: layer.bias,
    refreshMs: +layer.stats.lastMs.toFixed(2), refreshes: layer.stats.refreshes, calls: measureCalls(),
    guide: { w: +guide.userData.width.toFixed(2), h: +guide.userData.height.toFixed(2), panelH: +guide.userData.panelHeight.toFixed(2) },
  };
}

// ---------------------------------------------------------------- loop
let frameNo = 0, lastStats = 0;
const statsEl = document.getElementById("stats");
function frame(now) {
  frameNo++;
  layer.update(camera.position.x, camera.position.z, OFFS, U.uNight.value, frameNo);
  controls.update();
  composer.render();
  if (now - lastStats > 500) {
    lastStats = now;
    const u = layer.atlas.usage(frameNo), s = layer.stats, i = s.instances;
    statsEl.textContent = `instances  shop ${i.shop}  plate ${i.plate}  pole ${i.pole}  tower ${i.tower}  speed ${i.speed}\n` +
      `atlas      ${u.entries} entries, ${u.shelves} shelves, fill ${(u.fill * 100).toFixed(1)} %  bias ${layer.bias.toFixed(2)}\n` +
      `refresh    ${s.lastMs.toFixed(2)} ms, drawn ${s.drawnLast}, total drawn ${layer.atlas.stats.drawn}, sub-uploads ${layer.atlas.stats.uploads}`;
  }
  if (!window.labReady && frameNo > 4 && !layer.busy) window.labReady = true;
  requestAnimationFrame(frame);
}
// resolves once the layer has refreshed for the current camera and drawn everything in range
function settle(extraFrames = 3) {
  layer.dirty = true;
  return new Promise(res => {
    let calm = 0;
    const tick = () => { if (!layer.busy) calm++; else calm = 0; if (calm > extraFrames) res(report()); else requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
setNight(Q.get("night") === "1");
setView(Q.get("view") || "street");
requestAnimationFrame(frame);
window.lab = { THREE, scene, camera, controls, renderer, layer, guide, TextAtlas, setNight, setView, settle, report, measureCalls, VIEWS, U, OFFS };
</script>
</body>
</html>
